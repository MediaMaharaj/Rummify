<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joining Rummify Session...</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0D3B2E;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    .card{background:#1A5C42;border:1px solid #C9A84C;border-radius:20px;padding:40px 32px;text-align:center;max-width:360px;width:90%;}
    .logo{font-size:52px;margin-bottom:8px;}
    .title{font-size:28px;font-weight:800;color:#C9A84C;margin-bottom:6px;letter-spacing:-0.5px;}
    .sub{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:32px;}
    .status{font-size:15px;color:#fff;margin-bottom:24px;min-height:22px;}
    .spinner{width:40px;height:40px;border:3px solid rgba(201,168,76,0.2);border-top-color:#C9A84C;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .btn{display:inline-block;background:#C9A84C;color:#0D3B2E;font-weight:800;font-size:15px;padding:14px 28px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;width:100%;margin-bottom:10px;}
    .btn-outline{background:none;color:#C9A84C;border:1px solid #C9A84C;font-size:13px;padding:10px 20px;border-radius:10px;cursor:pointer;width:100%;text-decoration:none;display:inline-block;}
    .hidden{display:none;}
    .session-id{font-size:11px;color:rgba(255,255,255,0.3);margin-top:20px;word-break:break-all;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">&#x1F0CF;</div>
  <div class="title">Rummify</div>
  <div class="sub">You've been invited to join a session</div>

  <!-- Loading state -->
  <div id="state-loading">
    <div class="spinner"></div>
    <div class="status">Opening Rummify...</div>
  </div>

  <!-- App not installed state -->
  <div id="state-download" class="hidden">
    <div class="status">Get the app to join this session</div>
    <a id="btn-android" class="btn" href="https://play.google.com/store/apps/details?id=ai.rummify.app">
      Download on Android
    </a>
    <a id="btn-ios" class="btn" href="https://apps.apple.com/app/rummify/id6778941983" style="margin-top:10px">
      Download on iPhone
    </a>
    <div class="session-id" id="session-label"></div>
  </div>

  <!-- Already tried, retry state -->
  <div id="state-retry" class="hidden">
    <div class="status">Rummify is installed? Tap to open.</div>
    <button class="btn" onclick="tryOpen()">Open in Rummify</button>
    <a href="https://play.google.com/store/apps/details?id=ai.rummify.app" class="btn-outline" style="margin-top:8px;display:block">
      Download Rummify
    </a>
    <div class="session-id" id="session-label-2"></div>
  </div>
</div>

<script>
  // Extract session ID from URL path: /join/SESSION_ID
  const pathParts = window.location.pathname.split('/');
  const sessionId = pathParts[pathParts.length - 1] || '';

  document.getElementById('session-label').textContent = sessionId ? 'Session: ' + sessionId : '';
  document.getElementById('session-label-2').textContent = sessionId ? 'Session: ' + sessionId : '';

  function showState(id) {
    ['state-loading','state-download','state-retry'].forEach(s => {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  function tryOpen() {
    if (!sessionId) { showState('state-download'); return; }

    // Try HTTPS App Link first (Android), then rummify:// scheme (iOS + Android fallback)
    const appLink = 'rummify://join/' + sessionId;
    const httpsLink = 'https://rummify.ai/join/' + sessionId;

    // Attempt to open the app
    const start = Date.now();
    window.location.href = appLink;

    // If still here after 1.8s, app probably not installed
    setTimeout(() => {
      if (Date.now() - start < 2500) {
        showState('state-retry');
      }
    }, 1800);
  }

  // Auto-attempt on load
  if (sessionId) {
    tryOpen();
  } else {
    showState('state-download');
  }
</script>
</body>
</html>
